name: 功能建議
description: 建議主程式的新功能或改進
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請描述目前遇到的困難，而不是只寫想要的解法
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的其他做法
    validations:
      required: false
